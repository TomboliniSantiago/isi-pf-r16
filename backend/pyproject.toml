[project]
name = "eugenia-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # Depends() en argumentos por defecto es el idiom de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
